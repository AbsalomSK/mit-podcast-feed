name: 팟캐스트 동기화

on:
  schedule:
    - cron: "17 * * * *"   # 매시 17분 (UTC)
  workflow_dispatch:
    inputs:
      max_per_run:
        description: "이번 실행에서 처리할 최대 편수 (백필용)"
        default: "10"

concurrency:
  group: podcast-sync
  cancel-in-progress: false

permissions:
  contents: write   # feed.xml 커밋

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 의존성 설치
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q -U -r requirements.txt
      - name: 피드 조립 점검
        run: python test_sync_podcast.py
      - name: 유튜브 쿠키 (선택)
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          if [ -n "$YT_COOKIES" ]; then printf '%s' "$YT_COOKIES" > "$RUNNER_TEMP/cookies.txt"; fi
      - name: 동기화
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          MEDIA_BASE_URL: ${{ vars.MEDIA_BASE_URL }}
          FEED_BASE_URL: ${{ vars.FEED_BASE_URL }}
          SHOW_EMAIL: ${{ vars.SHOW_EMAIL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAX_PER_RUN: ${{ inputs.max_per_run || '10' }}
          YT_COOKIES_FILE: ${{ runner.temp }}/cookies.txt
        run: python sync_podcast.py
      - name: feed.xml 커밋
        if: always()
        run: |
          if [ -n "$(git status --porcelain feed.xml)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add feed.xml
            git commit -m "chore: 피드 갱신"
            git push
          fi
